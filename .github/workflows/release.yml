name: Release

# Runs when a version tag such as v0.3.0 is pushed. Tests must pass before anything is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the TOC version
        run: |
          TOC_VERSION=$(grep -oP '^## Version:\s*\K\S+' ForeverPlanner/ForeverPlanner.toc)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TOC $TOC_VERSION, tag $TAG_VERSION"
          test "$TOC_VERSION" = "$TAG_VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa==2.8
      - name: Run tests
        run: python tests/run_all.py

      - name: Build the zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "ForeverPlanner-$VERSION.zip" ForeverPlanner
          echo "ZIP=ForeverPlanner-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Forever Planner ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG-latest.md
