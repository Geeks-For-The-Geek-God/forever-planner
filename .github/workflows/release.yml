name: Release

# Publishes a release whenever the version in ForeverPlanner.toc changes on main
# (or when run by hand from the Actions tab). Tests must pass before anything is published.
on:
  push:
    branches: [main]
    paths:
      - "ForeverPlanner/**"
      - "CHANGELOG-latest.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          VERSION=$(grep -oP '^## Version:\s*\K\S+' ForeverPlanner/ForeverPlanner.toc)
          CORE=$(grep -oP 'FP\.version = "\K[^"]+' ForeverPlanner/Core.lua)
          echo "TOC $VERSION, Core.lua $CORE"
          test "$VERSION" = "$CORE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - name: Run tests
        if: env.SKIP != '1'
        run: |
          pip install lupa==2.8
          python tests/run_all.py

      - name: Build the zip and publish
        if: env.SKIP != '1'
        run: |
          ZIP="ForeverPlanner-$VERSION.zip"
          zip -r "$ZIP" ForeverPlanner
          gh release create "v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Forever Planner $VERSION" \
            --notes-file CHANGELOG-latest.md
